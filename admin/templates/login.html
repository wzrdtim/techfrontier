{% extends "base.html" %}

{% block title %}Admin sign in — {{ app_name }}{% endblock %}

{% block content %}
<section class="mx-auto max-w-md animate-rise pt-8">
  <h1 class="text-4xl font-extrabold tracking-tight sm:text-5xl">{{ app_name }}</h1>
  <p class="mt-3 text-ink-soft">Sign in to manage posts.</p>

  {% if error %}
  <p class="mt-4 text-danger">{{ error }}</p>
  {% endif %}

  <form method="post" action="/admin/login" class="mt-8 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <div>
      <label for="username" class="mb-1 block text-sm font-semibold">Username</label>
      <input
        id="username"
        name="username"
        type="text"
        required
        autocomplete="username"
        value="admin"
        class="w-full rounded border border-line bg-white/55 px-3 py-2.5 outline-none transition focus:border-accent focus:ring-2 focus:ring-accent-wash"
      />
    </div>
    <div>
      <label for="password" class="mb-1 block text-sm font-semibold">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        required
        autocomplete="current-password"
        class="w-full rounded border border-line bg-white/55 px-3 py-2.5 outline-none transition focus:border-accent focus:ring-2 focus:ring-accent-wash"
      />
    </div>
    <button type="submit" class="inline-flex w-full items-center justify-center rounded bg-accent px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-accent-deep">
      Sign in
    </button>
  </form>
</section>
{% endblock %}
